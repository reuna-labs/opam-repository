name: Validate overlay

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 4.14.2
      - name: Check package metadata and dependency cycles
        run: ./tools/check.sh

  install:
    strategy:
      fail-fast: false
      matrix:
        ocaml-compiler:
          - 4.14.2
          - 5.2.1
          - 5.5.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
      - name: Add the public Reuna repository
        run: opam repository add reuna https://github.com/reuna-labs/opam-repository.git
      - name: Install the first-release package train
        run: |
          sed '/^#/d; /^$/d' release/first-release.lock | cut -f1 | \
            xargs opam install --yes --assume-depexts
      - name: Build an external consumer from installed artifacts
        run: opam exec -- dune build --root consumer @all
